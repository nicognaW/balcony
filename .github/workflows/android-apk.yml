# Builds the Android app as an APK and attaches it to the run as an artifact
# (Actions → this run → Artifacts → balcony-android-apk). No iOS build.
# Then installs it on an emulator, opens every playground scenario and
# screen by deep link, and attaches the screenshots and logcat
# (balcony-playground-screenshots).
#
# The native project is generated by `expo prebuild` on every run and never
# committed. The release build is signed with the template's debug key, which
# is enough to sideload it; there is no Play Store release.
name: Android APK

on:
  push:
    paths:
      - apps/mobile/**
      - packages/client/**
      - packages/contracts/**
      - bun.lock
      - .github/workflows/android-apk.yml
      - apps/mobile/scripts/playground-screenshots.sh
  workflow_dispatch:
    inputs:
      screenshots_branch:
        description: Also push the screenshots to the branch playground-screenshots/<ref> (pushes to branches other than the default always do)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Expo CLI, Metro and Gradle's bundling step run on Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Generate the Android project
        run: bun run prebuild
        working-directory: apps/mobile
        env:
          CI: 1
          EXPO_NO_GIT_STATUS: 1
      # arm64 for phones, x86_64 for the emulator below.
      - name: Build the APK
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64
        working-directory: apps/mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: balcony-android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  playground-screenshots:
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      # Only for the screenshots branch.
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: balcony-android-apk
          path: apk
      # The emulator needs KVM, which the runner has but doesn't grant.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Take the playground screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # Animations stay on: the app turns its motion off when they're off.
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash apps/mobile/scripts/playground-screenshots.sh apk/app-release.apk screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: balcony-playground-screenshots
          path: screenshots
          if-no-files-found: error
      # For readers that can't download artifacts (coding agents in sandboxes
      # that reach github.com but not its artifact storage): the same files on
      # a throwaway branch, replaced on every run of a working branch.
      - name: Push the screenshots to a branch
        if: always() && (inputs.screenshots_branch || (github.event_name == 'push' && github.ref_name != github.event.repository.default_branch))
        working-directory: screenshots
        env:
          BRANCH: playground-screenshots/${{ github.ref_name }}
        run: |
          git init -q -b "$BRANCH"
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "Playground screenshots of ${{ github.sha }}"
          # GitHub sometimes rejects the push with "fatal error in commit_refs"
          # (its side, not ours): try a few times before failing the job.
          for attempt in 1 2 3 4; do
            if git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/$BRANCH"; then
              exit 0
            fi
            sleep $((attempt * 15))
          done
          exit 1
