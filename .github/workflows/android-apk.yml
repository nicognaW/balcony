# Builds the Android app as an APK and attaches it to the run as an artifact
# (Actions → this run → Artifacts → balcony-android-apk). No iOS build.
#
# The native project is generated by `expo prebuild` on every run and never
# committed. The release build is signed with the template's debug key, which
# is enough to sideload it; there is no Play Store release.
name: Android APK

on:
  push:
    paths:
      - apps/mobile/**
      - packages/client/**
      - packages/contracts/**
      - bun.lock
      - .github/workflows/android-apk.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Expo CLI, Metro and Gradle's bundling step run on Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Generate the Android project
        run: bun run prebuild
        working-directory: apps/mobile
        env:
          CI: 1
          EXPO_NO_GIT_STATUS: 1
      # arm64 only: every phone this is meant for, and a quarter of the build.
      - name: Build the APK
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a
        working-directory: apps/mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: balcony-android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
