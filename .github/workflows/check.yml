name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # uncheck runs on Node (22.20 or later).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check

  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # No AI attribution in history (see #2).
      - run: |
          if git log --format='%H%n%B' HEAD | grep -iE '^(Co-Authored-By: Claude|Claude-Session:)|Generated with \[Claude Code\]|claude\.ai/code/session_'; then
            echo "Remove the AI attribution lines above from these commits." >&2
            exit 1
          fi
