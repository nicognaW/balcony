name: Strip AI footer

# Removes "Generated by Claude Code" style footers from issues, PRs, reviews
# and comments. Edits made with GITHUB_TOKEN don't trigger workflows, so this
# can't loop.

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  issues: write
  pull-requests: write

jobs:
  strip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const FOOTER = [
              /^_?Generated (by|with) \[Claude Code\]\([^)]*\)_?\.?$/i,
              /^🤖 Generated with \[Claude Code\]\([^)]*\)$/,
              /^https:\/\/claude\.ai\/code\/session_\w+$/,
              /^Co-Authored-By: Claude\b.*$/i,
              /^Claude-Session: .*$/i,
            ];
            const strip = (body) => {
              if (!body) return null;
              const lines = body.replace(/\r\n/g, "\n").split("\n");
              let removed = false;
              for (;;) {
                while (lines.length && lines.at(-1).trim() === "") lines.pop();
                if (!lines.length) break;
                const last = lines.at(-1).trim();
                if (FOOTER.some((r) => r.test(last))) { lines.pop(); removed = true; continue; }
                if (removed && /^(-{3,}|\*{3,}|_{3,})$/.test(last)) { lines.pop(); continue; }
                break;
              }
              const out = lines.join("\n");
              return removed && out.trim() ? out : null;
            };
            const { owner, repo } = context.repo;
            const p = context.payload;
            const e = context.eventName;
            if (e === "issues") {
              const body = strip(p.issue.body);
              if (body) await github.rest.issues.update({ owner, repo, issue_number: p.issue.number, body });
            } else if (e === "pull_request_target") {
              const body = strip(p.pull_request.body);
              if (body) await github.rest.pulls.update({ owner, repo, pull_number: p.pull_request.number, body });
            } else if (e === "issue_comment") {
              const body = strip(p.comment.body);
              if (body) await github.rest.issues.updateComment({ owner, repo, comment_id: p.comment.id, body });
            } else if (e === "pull_request_review_comment") {
              const body = strip(p.comment.body);
              if (body) await github.rest.pulls.updateReviewComment({ owner, repo, comment_id: p.comment.id, body });
            } else if (e === "pull_request_review") {
              const body = strip(p.review.body);
              if (body) await github.rest.pulls.updateReview({ owner, repo, pull_number: p.pull_request.number, review_id: p.review.id, body });
            }
